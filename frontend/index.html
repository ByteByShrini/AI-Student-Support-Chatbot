<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AI Student Support Chatbot</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

    <div class="chat-container">

        <!-- Header -->
        <div class="chat-header">

    <div class="header-content">

        <div>
            <h1>AI Student Support Chatbot</h1>

            <p>
    <span class="status-dot"></span>
    Online • Student Support Assistant
</p>
        </div>

        <button
            id="clear-button"
            type="button"
        >
            Clear Chat
        </button>

    </div>

</div>

        <!-- Chat Area -->
        <div
            id="chat-messages"
            class="chat-messages"
        >

            <div class="message bot">
                Hello! 👋
                <br><br>
                I'm your Student Support Assistant.
                Ask me about attendance, exams,
                scholarships, library services,
                and other student-related information.
            </div>

        </div>


        <!-- Suggested Questions -->
        <div class="suggested-questions">

            <button
                type="button"
                onclick="askQuestion('What are the attendance requirements?')"
            >
                Attendance
            </button>

            <button
                type="button"
                onclick="askQuestion('How do I apply for a scholarship?')"
            >
                Scholarships
            </button>

            <button
                type="button"
                onclick="askQuestion('How can I download my admit card?')"
            >
                Examinations
            </button>

        </div>


        <!-- Input -->
        <div class="chat-input-area">

            <input
                type="text"
                id="chat-input"
                placeholder="Type your question..."
                autocomplete="off"
            >

            <button
                type="button"
                id="send-button"
            >
                Send
            </button>

        </div>

    </div>


    <!-- JavaScript -->
    <script src="js/script.js"></script>

</body>

</html>
